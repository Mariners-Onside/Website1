<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Core Committee Members</title>
  <style>
    /* Loader styles */
    #loader-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(180deg,#001217,#021421);z-index:99999;color:#cffff0}
    .spinner{width:72px;height:72px;border-radius:50%;border:8px solid rgba(255,255,255,0.08);border-top-color:#00ff9a;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loader-text{margin-top:12px;font-weight:800}

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #2b0c15 0%, #0b0f14 45%, #05070a 100%);
      min-height:100vh;
      padding:40px 20px 60px;
      color:#f4f5f7;
    }
    h1 {
      text-align:center;
      color:#fff;
      margin-bottom:36px;
      font-size:2.8rem;
      letter-spacing:1px;
      text-shadow:0 4px 18px rgba(0,0,0,0.35);
    }
    .container {
      max-width:1240px;
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:28px;
    }
    .card {
      background:rgba(255,255,255,0.95);
      color:#1f2937;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 18px 45px rgba(0,0,0,0.28);
      transition:transform .28s ease, box-shadow .28s ease;
      border:1px solid rgba(255,255,255,0.2);
      position:relative;
    }
    .card::before {
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(135deg, rgba(255,255,255,0.12), transparent 55%);
      pointer-events:none;
    }
    .card:hover { transform:translateY(-8px) scale(1.01); box-shadow:0 24px 55px rgba(0,0,0,0.34); }
    .card img {
      width:100%;
      height:290px;
      object-fit:cover;
      object-position:center;
      display:block;
      border-bottom:3px solid #b91c1c;
    }
    .card-content { padding:22px 20px 24px; text-align:center; }
    .card h2 { font-size:1.35rem; margin-bottom:8px; color:#111827; }
    .card h3 {
      font-size:1rem;
      color:#b91c1c;
      margin-bottom:12px;
      font-weight:700;
      letter-spacing:.4px;
      text-transform:uppercase;
    }
    .card p { font-size:0.95rem; line-height:1.65; color:#4b5563; }
    .placeholder-img {
      background:linear-gradient(135deg,#f59e0b,#dc2626);
      display:flex; align-items:center; justify-content:center; font-size:3rem; color:#fff; font-weight:bold; height:290px;
    }
    .badge { display:inline-block; padding:6px 10px; border-radius:999px; background:#111827; color:#fff; font-size:.76rem; margin-bottom:14px; letter-spacing:.6px; }
    @media (max-width: 600px) { h1 { font-size:2.2rem; } .card img, .placeholder-img { height:250px; } }
  </style>
</head>
<body>

  <div id="loader-overlay" aria-hidden="false">
    <div class="spinner" role="img" aria-label="Loading"></div>
    <div class="loader-text">Loading...</div>
  </div>

  <h1>Meet Our Amazing Core Committe Team</h1>

  <div class="container" id="team-container">
  </div>

  <script>
    const teamMembers = [
    {
        name: "Salil Chatterjee",
        position: "President",
        photo: "sa11.jpg",
        bio: "Serving as the President, this individual provides expert guidance on legal matters, ensuring compliance, risk management, and clear decision-making. With strong analytical skills and a commitment to integrity, they help protect the organization’s interests and support smooth, lawful operations."
      },
      {
        name: "Soumyabrata Akuli",
        position: "Vice President",
        photo: "c1.jpg",
        bio: "Soumyabrata Akuli is the Club Field Manager at Mariners Onside, with 5 years of experience in facility management and club operations. Known for sustainable field maintenance and smooth event coordination, he recently led the successful in show the tifo In Mbsg Vs Ahal Fk Match, boosting performance and efficiency. He gives high-quality environment for all club members and visitors."
      },
      {
        name: "Anandarup Bandyopadhyay",
        position: "General Secretary",
        photo: "c3.jpg",
        bio: "Anandrup Bandhopadhay serves as the Secretary of the fans club, ensuring smooth communication, efficient coordination, and timely execution of all administrative duties. Known for his discipline and dedication, he manages documentation, supports event planning, and helps maintain strong connections among members."
      },
      {
        name: "Giri Adhikary",
        position: "Joint Secretary",
        photo: "g1.jpg",
        bio: "Giri Adhikary is a Joint Secretary and core member of Mariners Onside. He plays an essential role in the activities and direction of the organization."
      },
      {
        name: "Suvadeep Chatterjee",
        position: "Chief-Coordinator",
        photo: "p11.jpg",
        bio: "Suvadeep Chatterjee is the current Co-Ordinator of the Mariners Onside, bringing 2 years of field experience in  to the role. Passionate about works to ensure the club provides a welcoming and impactful experience for all members."
      },

      {
        name: "Rishab Chakraborty",
        position: "Treasurer",
        photo: "r1.jpg",
        bio: "Rishab Chakraborty serves as the Treasurer, overseeing budgeting, financial planning, and transparent fund management. With strong analytical skills and a commitment to accuracy, he ensures financial integrity and supports smooth, accountable operations within the organization."
      },
      {
        name: "Jayanta Chatterjee",
        position: "Accountant",
        photo: "jja1.jpg",
        bio: "Jayanta Chatterjee serves as the Accountant, overseeing financial planning, budgeting, and transparent fund management. Known for his reliability and attention to detail, he helps ensure smooth financial operations and maintains accountability within the organization."
      },
      {
        name: "Tathagata Dutta",
        position: " Social media head",
        photo: "ta1.jpg",
        bio: "As the Member Of Core Committe, he blends his experience to provide creative media ideas and skillfully manages the team to execute engaging and impactful content strategies."
      },
      {
        name: "Argho Dutta",
        position: "Designer Head",
        photo: "ar1.jpg",
        bio: "Argho Dutta serves as the Core-Committe Member of the fan club, leading the club’s digital presence with precision and creativity. He oversees website updates, manages content flow, and ensures a smooth, engaging user experience. His technical expertise and dedication help strengthen the club’s online identity and reach."
      },
      {
        name: "Ranit Nag",
        position: "Field executive",
        photo: "r11.jpg",
        bio: "Ranit Nag is a senior and core member of Mariners Onside. He plays an essential role in the activities and direction of the organization."
      },

    ];

    // Generate cards dynamically
    const container = document.getElementById('team-container');

    teamMembers.forEach(member => {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        ${member.photo 
          ? `<img src="${member.photo}" alt="${member.name}">`
          : `<div class="placeholder-img">${member.name.charAt(0)}</div>`
        }
        <div class="card-content">
          <span class="badge">Team Member</span>
          <h2>${member.name}</h2>
          <h3>${member.position}</h3>
          <p>${member.bio}</p>
        </div>
      `;

      container.appendChild(card);
    });
  </script>

    <script>
      (function(){
        const overlay = document.getElementById('loader-overlay');
        if(!overlay) return;
        const minMs = 500;
        const start = Date.now();
        function hide(){
          const wait = Math.max(0, minMs - (Date.now() - start));
          setTimeout(()=>{
            if(!overlay) return;
            overlay.style.transition = 'opacity .4s ease';
            overlay.style.opacity = '0';
            overlay.setAttribute('aria-hidden','true');
            setTimeout(()=> overlay.remove(), 450);
          }, wait);
        }
        if(document.readyState === 'complete') hide(); else window.addEventListener('load', hide);
      })();
    </script>

  <script>
    document.addEventListener('contextmenu', function(event) {
      event.preventDefault();
    });

    document.addEventListener('keydown', function(event) {
      if (event.key === 'F12' ||
          (event.ctrlKey && event.shiftKey && ['I', 'J', 'C'].includes(event.key.toUpperCase())) ||
          (event.ctrlKey && event.key.toUpperCase() === 'U')) {
        event.preventDefault();
      }
    });
  </script>
</body>

</html>
